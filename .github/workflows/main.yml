# نام Workflow که در تب Actions نمایش داده می‌شود
name: CI/CD Pipeline

# تعریف تریگر: چه زمانی این پایپ‌لاین اجرا شود؟
on:
  push:
    branches: [ "main" ] # هر بار که کدی به شاخه main پوش شود

# تعریف کارها (Jobs) که باید انجام شوند
jobs:
  build-and-push:
    # سیستم‌عاملی که پایپ‌لاین روی آن اجرا می‌شود
    runs-on: ubuntu-latest

    # دادن دسترسی لازم برای پوش کردن ایمیج به GHCR
    permissions:
      contents: read
      packages: write

    # مراحل اجرایی
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # --- NEW STEP ADDED HERE ---
      - name: Convert repository name to lowercase
        id: string
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      # --- END OF NEW STEP ---

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # --- THIS LINE IS MODIFIED ---
          tags: ghcr.io/${{ steps.string.outputs.repo_lc }}:${{ github.sha }}
