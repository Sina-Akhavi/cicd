name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push: # Renamed for clarity
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs: # <-- NEW: Define outputs for this job
      image_name: ${{ steps.set-image-name.outputs.image_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: string
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      
      - name: Set image name output # <-- NEW: Step to create the output variable
        id: set-image-name
        run: echo "image_name=ghcr.io/${{ steps.string.outputs.repo_lc }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.set-image-name.outputs.image_name }} # Use the variable

  deploy-and-test: # <-- NEW: This is our second job
    name: Deploy to Runner and Run Integration Test
    runs-on: ubuntu-latest
    needs: build-and-push # <-- NEW: This job depends on the one above
    permissions:
      packages: read # Only needs read permission to pull the image

    steps:
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image from GHCR
        run: docker pull ${{ needs.build-and-push.outputs.image_name }} # <-- NEW: Using the output from the previous job

      - name: Run the container
        run: docker run -d -p 8080:3000 --name my-app ${{ needs.build-and-push.outputs.image_name }}

      - name: Wait for container to start
        run: sleep 5 # Give the app a few seconds to initialize

      - name: Perform integration test
        run: |
          response=$(curl -s http://localhost:8080)
          if [ "$response" = "Hello World!" ]; then
            echo "✅ Integration test PASSED: Received '$response'"
            exit 0
          else
            echo "❌ Integration test FAILED: Received '$response'"
            exit 1
          fi
